name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "24"
  REGISTRY_URL: "https://registry.npmjs.org"

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Pedelec $TAG_NAME" \
            --notes "Release bundle for Pedelec $TAG_NAME"

  verify-versions:
    name: Verify version sync
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify package versions match tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag_name }}" ]; then
            VERSION="${{ inputs.tag_name }}"
            VERSION="${VERSION#v}"
          fi

          SDK_VERSION=$(node -p "require('./sdk/package.json').version")
          DESKTOP_VERSION=$(node -p "require('./desktop/package.json').version")
          EXT_VERSION=$(node -p "require('./extension/manifest.json').version")
          TAURI_VERSION=$(node -p "require('./desktop/tauri/tauri.conf.json').version")
          CARGO_VERSION=$(node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('./desktop/Cargo.toml', 'utf8');
          const m = text.match(/^\[workspace\.package\][\s\S]*?^version\s*=\s*"([^"]+)"/m);
          console.log(m?.[1] ?? '');
          NODE
          )

          echo "tag=$VERSION"
          echo "sdk=$SDK_VERSION"
          echo "desktop=$DESKTOP_VERSION"
          echo "extension=$EXT_VERSION"
          echo "tauri=$TAURI_VERSION"
          echo "cargo=$CARGO_VERSION"

          test "$SDK_VERSION" = "$VERSION"
          test "$DESKTOP_VERSION" = "$VERSION"
          test "$EXT_VERSION" = "$VERSION"
          test "$TAURI_VERSION" = "$VERSION"
          test "$CARGO_VERSION" = "$VERSION"

  chrome-extension:
    name: Package Chrome Extension
    needs: [create-release, verify-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Package extension zip
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          mkdir -p dist

          cd extension
          zip -r "../dist/pedelec-chrome-extension-v${VERSION}.zip" . \
            -x "*.test.js" \
            -x "__tests__/*" \
            -x ".DS_Store"

      - name: Upload extension zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" dist/*.zip --clobber

  integration-guideline:
    name: Package Pedelec Integration Guideline
    needs: [create-release, verify-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Build SDK declaration
        working-directory: sdk
        run: npm run build

      - name: Stage integration guideline bundle
        shell: bash
        run: |
          set -euo pipefail

          bundle_dir="dist/pedelec-integration-guideline"
          rm -rf "$bundle_dir" "dist/pedelec-integration-guideline.zip"
          mkdir -p "$bundle_dir/skill" "$bundle_dir/docs" "$bundle_dir/sdk"

          cp -R skills/pedelec-integration/. "$bundle_dir/skill/"
          cp .github/release-assets/pedelec-integration-guideline/START_HERE.md \
            "$bundle_dir/START_HERE.md"
          cp -R dev-docs/src/content/docs/. "$bundle_dir/docs/"
          cp sdk/package.json "$bundle_dir/sdk/package.json"
          cp sdk/README.md "$bundle_dir/sdk/README.md"
          cp sdk/dist/index.d.ts "$bundle_dir/sdk/index.d.ts"

      - name: Validate staged integration guideline bundle
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail

          bundle_dir="dist/pedelec-integration-guideline"
          release_version="${TAG_NAME#v}"
          sdk_version=$(node -p "require('./$bundle_dir/sdk/package.json').version")

          test "$sdk_version" = "$release_version"
          grep -Fxq 'name: pedelec-integration' "$bundle_dir/skill/SKILL.md"

          required_files=(
            START_HERE.md
            skill/SKILL.md
            skill/references/sdk-integration.md
            skill/references/session-lifecycle.md
            skill/references/ui-components.md
            docs/getting-started/quick-start.mdx
            docs/sdk/creating-sessions.mdx
            docs/tools/overview.mdx
            docs/reference/pedelec.mdx
            sdk/package.json
            sdk/README.md
            sdk/index.d.ts
          )

          for relative_path in "${required_files[@]}"; do
            test -f "$bundle_dir/$relative_path" || {
              echo "Missing required bundle file: $relative_path" >&2
              exit 1
            }
          done

      - name: Create and verify integration guideline zip
        shell: bash
        run: |
          set -euo pipefail

          archive_path="dist/pedelec-integration-guideline.zip"
          (
            cd dist
            zip -qr "$(basename "$archive_path")" pedelec-integration-guideline
          )

          unzip -t "$archive_path"
          archive_entries=$(unzip -Z1 "$archive_path")
          printf '%s\n' "$archive_entries"

          for entry in \
            pedelec-integration-guideline/START_HERE.md \
            pedelec-integration-guideline/skill/SKILL.md \
            pedelec-integration-guideline/docs/ \
            pedelec-integration-guideline/sdk/; do
            grep -Fxq "$entry" <<<"$archive_entries" || {
              echo "Missing archive entry: $entry" >&2
              exit 1
            }
          done

          if grep -Eq '(^|/)(node_modules|\.agent_temp|\.astro|dev-docs/dist)(/|$)' <<<"$archive_entries"; then
            echo "Unexpected build or temporary content found in archive." >&2
            exit 1
          fi

      - name: Upload integration guideline zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" \
            dist/pedelec-integration-guideline.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  tauri:
    name: Build Tauri - ${{ matrix.label }}
    needs: [create-release, verify-versions]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            platform: windows-latest
            args: ""
            helper_target: ""
          - label: macos-arm64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            helper_target: "aarch64-apple-darwin"
            release_arch: "aarch64"
          - label: macos-x64
            platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            helper_target: "x86_64-apple-darwin"
            release_arch: "x86_64"
          - label: linux-x64
            platform: ubuntu-22.04
            args: "--bundles deb --config tauri/tauri.linux.conf.json"
            helper_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify pinned Deno release metadata
        working-directory: desktop
        run: npm run test:release-metadata

      - name: Prepare Apple signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PRIVATE: ${{ secrets.APPLE_API_KEY_PRIVATE }}
        run: |
          set -euo pipefail

          required_secrets=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_API_ISSUER
            APPLE_API_KEY
            APPLE_API_KEY_PRIVATE
          )
          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required secret: ${secret_name}" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/apple-developer-id.p12"
          keychain_path="$RUNNER_TEMP/pedelec-signing.keychain-db"
          private_key_dir="$RUNNER_TEMP/private_keys"
          api_key_path="$private_key_dir/AuthKey_${APPLE_API_KEY}.p8"
          keychain_password="$(openssl rand -base64 32)"
          original_default_keychain="$(security default-keychain -d user | tr -d '\"')"

          mkdir -p "$private_key_dir"
          umask 077

          # Persist cleanup targets before any credential operation can fail.
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_ORIGINAL_DEFAULT_KEYCHAIN=$original_default_keychain" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_CERTIFICATE" \
            | tr -d '\r\n' \
            | /usr/bin/base64 -D \
            > "$certificate_path"
          [ -s "$certificate_path" ] || {
            echo "Decoded Apple certificate is empty." >&2
            exit 1
          }

          security create-keychain \
            -p "$keychain_password" \
            "$keychain_path"
          security set-keychain-settings \
            -lut 21600 \
            "$keychain_path"
          security unlock-keychain \
            -p "$keychain_password" \
            "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          if ! security find-identity \
            -v \
            -p codesigning \
            "$keychain_path" \
            | grep -Fq "$APPLE_SIGNING_IDENTITY"; then
            echo "APPLE_SIGNING_IDENTITY was not found in the imported keychain." >&2
            security find-identity -v -p codesigning "$keychain_path" >&2 || true
            exit 1
          fi

          printf '%s' "$APPLE_API_KEY_PRIVATE" > "$api_key_path"
          chmod 600 "$api_key_path"

      - name: Build and upload Windows Tauri bundles
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PEDELEC_HELPER_TARGET: ${{ matrix.helper_target }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: "Pedelec ${{ inputs.tag_name || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
          assetNamePattern: "Pedelec-[version]-[platform]-[arch]-[bundle][ext]"

      - name: Verify Windows Deno resources and runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $resourceDir = Join-Path $PWD "desktop/tauri/binaries"
          $expected = @("pedelec-cli.exe", "pedelec-deno.exe", "pedelec-agent.exe", "pedelec-native-host.exe", "deno.exe")
          foreach ($name in $expected) {
            $path = Join-Path $resourceDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing staged Windows Tauri resource: $name"
            }
          }
          if (Test-Path -LiteralPath (Join-Path $resourceDir "deno") -PathType Leaf) {
            throw "Unexpected extensionless raw Deno resource in Windows staging directory."
          }
          node desktop/scripts/verify-deno-runtime.mjs --binary (Join-Path $resourceDir "deno.exe")

      - name: Build and upload macOS Tauri bundles
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PEDELEC_HELPER_TARGET: ${{ matrix.helper_target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: "Pedelec ${{ inputs.tag_name || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
          assetNamePattern: "Pedelec-[version]-[platform]-[arch]-[bundle][ext]"

      - name: Verify staged macOS Deno runtime
        if: runner.os == 'macOS'
        shell: bash
        run: node desktop/scripts/verify-deno-runtime.mjs --binary desktop/tauri/binaries/deno

      - name: Build and upload Linux Tauri bundle
        if: runner.os == 'Linux'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PEDELEC_HELPER_TARGET: ${{ matrix.helper_target }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: "Pedelec ${{ inputs.tag_name || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}
          assetNamePattern: "Pedelec-[version]-[platform]-[arch]-[bundle][ext]"

      - name: Verify staged Linux Deno runtime
        if: runner.os == 'Linux'
        shell: bash
        run: node desktop/scripts/verify-deno-runtime.mjs --binary desktop/tauri/binaries/deno

      - name: Verify Linux Debian bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          bundle_root="desktop/target/release/bundle"
          [ -d "$bundle_root" ] || {
            echo "Bundle directory not found: $bundle_root" >&2
            exit 1
          }

          deb_paths=()
          while IFS= read -r -d '' deb_path; do
            deb_paths+=("$deb_path")
          done < <(find "$bundle_root" -type f -name '*.deb' -print0)

          [ "${#deb_paths[@]}" -eq 1 ] || {
            echo "Expected exactly one Debian bundle, found ${#deb_paths[@]}" >&2
            printf '%s\n' "${deb_paths[@]}" >&2
            exit 1
          }

          deb_path="${deb_paths[0]}"
          dpkg-deb --info "$deb_path"
          deb_contents=$(dpkg-deb --contents "$deb_path")

          require_deb_entry() {
            local pattern="$1"
            local description="$2"
            grep -Eq "$pattern" <<<"$deb_contents" || {
              echo "Missing Debian payload entry: $description" >&2
              printf '%s\n' "$deb_contents" >&2
              exit 1
            }
          }

          require_deb_entry '/binaries/pedelec-deno$' 'pedelec-deno'
          require_deb_entry '/binaries/deno$' 'raw deno'
          require_deb_entry '/third-party-notices/DENO-LICENSE\.txt$' 'Deno license notice'
          require_deb_entry '^-rwx[^ ]*[[:space:]].*/binaries/pedelec-deno$' 'executable pedelec-deno'
          require_deb_entry '^-rwx[^ ]*[[:space:]].*/binaries/deno$' 'executable raw deno'

          forbidden_paths=()
          while IFS= read -r -d '' forbidden_path; do
            forbidden_paths+=("$forbidden_path")
          done < <(find "$bundle_root" -type f \( \
            -iname '*.AppImage' \
            -o -iname '*.rpm' \
            -o -iname '*.sig' \
            -o -name 'latest.json' \
          \) -print0)

          [ "${#forbidden_paths[@]}" -eq 0 ] || {
            echo "Unexpected Linux bundle found:" >&2
            printf '%s\n' "${forbidden_paths[@]}" >&2
            exit 1
          }

          echo "Verified Debian bundle: $deb_path"

      # tauri-action uploads first; this release remains a draft and a failed check
      # prevents these assets from being treated as a successful release.
      - name: Verify signed and notarized macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        env:
          HELPER_TARGET: ${{ matrix.helper_target }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          required_values=(
            APPLE_API_KEY_PATH
            APPLE_API_KEY
            APPLE_API_ISSUER
            TAG_NAME
            RELEASE_ARCH
          )
          for value_name in "${required_values[@]}"; do
            if [ -z "${!value_name:-}" ]; then
              echo "Missing required value: ${value_name}" >&2
              exit 1
            fi
          done

          bundle_root="desktop/target/$HELPER_TARGET/release/bundle"
          [ -d "$bundle_root" ] || { echo "Bundle directory not found: $bundle_root" >&2; exit 1; }

          apps=()
          while IFS= read -r -d '' app; do
            apps+=("$app")
          done < <(find "$bundle_root" -type d -name 'Pedelec.app' -print0)
          dmgs=()
          while IFS= read -r -d '' dmg; do
            dmgs+=("$dmg")
          done < <(find "$bundle_root" -type f -name '*.dmg' -print0)
          [ "${#apps[@]}" -eq 1 ] || { echo "Expected exactly one Pedelec.app, found ${#apps[@]}" >&2; exit 1; }
          [ "${#dmgs[@]}" -eq 1 ] || { echo "Expected exactly one DMG, found ${#dmgs[@]}" >&2; exit 1; }
          app_path="${apps[0]}"
          dmg_path="${dmgs[0]}"

          echo "Verifying app bundle signature and notarization."
          codesign --verify --deep --strict --verbose=2 "$app_path"
          app_info=$(codesign -dv --verbose=4 "$app_path" 2>&1)
          grep -Fq 'Authority=Developer ID Application:' <<<"$app_info"
          grep -Eq 'flags=.*\bruntime\b' <<<"$app_info"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

          echo "Verifying helper binary signatures."
          for helper_name in pedelec-cli pedelec-deno pedelec-agent pedelec-native-host deno; do
            helpers=()
            while IFS= read -r -d '' helper; do
              helpers+=("$helper")
            done < <(find "$app_path/Contents" -type f -name "$helper_name" -print0)
            [ "${#helpers[@]}" -eq 1 ] || { echo "Expected exactly one $helper_name in app bundle, found ${#helpers[@]}" >&2; exit 1; }
            helper_path="${helpers[0]}"
            codesign --verify --strict --verbose=2 "$helper_path"
            helper_info=$(codesign -dv --verbose=4 "$helper_path" 2>&1)
            grep -Fq 'Authority=Developer ID Application:' <<<"$helper_info"
            grep -Eq 'flags=.*\bruntime\b' <<<"$helper_info"
          done

          echo "Verifying DMG signature."
          codesign --verify --strict --verbose=2 "$dmg_path"
          dmg_info=$(codesign -dv --verbose=4 "$dmg_path" 2>&1)
          grep -Fq 'Authority=Developer ID Application:' <<<"$dmg_info"

          echo "Submitting DMG for notarization."
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          echo "Stapling DMG notarization ticket."
          xcrun stapler staple "$dmg_path"

          echo "Validating stapled DMG and Gatekeeper assessment."
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"

          version="${TAG_NAME#v}"
          asset_name="Pedelec-${version}-darwin-${RELEASE_ARCH}-dmg.dmg"
          asset_path="$RUNNER_TEMP/$asset_name"
          cp "$dmg_path" "$asset_path"

          echo "Replacing the draft release DMG asset with the stapled copy."
          gh release upload "$TAG_NAME" \
            "$asset_path" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Clean up Apple signing credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e

          if [ -n "${APPLE_ORIGINAL_DEFAULT_KEYCHAIN:-}" ] \
            && [ -e "$APPLE_ORIGINAL_DEFAULT_KEYCHAIN" ]; then
            security default-keychain \
              -d user \
              -s "$APPLE_ORIGINAL_DEFAULT_KEYCHAIN"
            security list-keychains \
              -d user \
              -s "$APPLE_ORIGINAL_DEFAULT_KEYCHAIN"
          fi

          if [ -n "${APPLE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH"
          fi

          rm -f \
            "${APPLE_CERTIFICATE_PATH:-}" \
            "${APPLE_API_KEY_PATH:-}"

  npm-publish:
    name: Publish SDK to npm
    needs: [verify-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Test SDK
        working-directory: sdk
        run: npm test

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Publish SDK
        working-directory: sdk
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_SPEC="${PACKAGE_NAME}@${PACKAGE_VERSION}"

          set +e
          VIEW_OUTPUT=$(npm view "$PACKAGE_SPEC" version 2>&1)
          VIEW_EXIT_CODE=$?
          set -e

          if [ "$VIEW_EXIT_CODE" -eq 0 ]; then
            echo "$PACKAGE_SPEC is already published. Skipping npm publish."
            exit 0
          fi

          if printf '%s' "$VIEW_OUTPUT" | grep -qE 'E404|404 Not Found|is not in this registry'; then
            echo "$PACKAGE_SPEC is not published yet. Publishing..."
            npm publish
            exit 0
          fi

          echo "Failed to check whether $PACKAGE_SPEC is already published." >&2
          printf '%s\n' "$VIEW_OUTPUT" >&2
          exit "$VIEW_EXIT_CODE"
