name: Release index

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# Every run reads current server state. Serialize all tags and manual rebuilds;
# never cancel an upload that may already be replacing the asset.
concurrency:
  group: release-index
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild public release index
    runs-on: ubuntu-latest
    steps:
      # Use maintained scripts from the default branch, including for old releases.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test release metadata scripts
        run: node --test .github/scripts/release-metadata.test.mjs
      - name: Upload index to GitHub latest formal release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-index.mjs
