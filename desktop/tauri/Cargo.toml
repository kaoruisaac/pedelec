[package]
name = "pedelec-app"
version.workspace = true
description = "Pedelec"
authors.workspace = true
edition.workspace = true
default-run = "pedelec-app"
autobins = false

[lib]
name = "pedelec_app_lib"
path = "src/lib.rs"

[[bin]]
name = "pedelec-app"
path = "src/bin/pedelec-app.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6"
encoding_rs = "0.8"
jsonschema = { version = "0.46.5", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "v7", "std"] }
pedelec-core.workspace = true
pedelec-ipc.workspace = true
pedelec-shared.workspace = true
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
tempfile = "3"
pedelec-core.workspace = true
pedelec-ipc.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSResponder",
] }
