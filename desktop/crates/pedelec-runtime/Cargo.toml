[package]
name = "pedelec-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
base64.workspace = true
chrono = { workspace = true }
serde_json = { workspace = true }
sha2.workspace = true
uuid = { workspace = true }
pedelec-core.workspace = true
pedelec-shared.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile.workspace = true
